<svg viewBox="0 0 1220 690" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1220" height="690" fill="#f2f0ee"/>
  <style>
    .title { font-size: 17px; font-weight: 700; fill: #191210; }
    .subtitle { font-size: 12px; fill: #555; }
    .stage-accent { font-size: 14px; font-weight: 700; fill: #bb5537; }
    .stage { font-size: 14px; font-weight: 700; fill: #191210; }
    .box-title { font-size: 13px; font-weight: 700; fill: #191210; }
    .box-title-accent { font-size: 13px; font-weight: 700; fill: #bb5537; }
    .box-sub { font-size: 11px; fill: #444; }
    .note { font-size: 11px; font-weight: 600; fill: #8a000d; }
    .badge-text { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; fill: #f0b9a4; }
    .caption { font-size: 11px; fill: #666; font-style: italic; }
    .arrow { stroke: #666; stroke-width: 1.4; fill: none; }
    .arrow-accent { stroke: #bb5537; stroke-width: 2.4; fill: none; }
    .blocked { stroke: #8a000d; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .arrow-label { font-size: 11px; fill: #3b2922; }
    .legend-text { font-size: 10.5px; fill: #555; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bb5537"/>
    </marker>
    <marker id="arBlocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a000d"/>
    </marker>
  </defs>

  <text x="595" y="30" text-anchor="middle" class="title">Cloudflare OS: Gatekeeper アーキテクチャ (GA4読み取り専用)</text>
  <text x="595" y="52" text-anchor="middle" class="subtitle">エージェント/Gadgetの外部通信は全遮断。Gatekeeperの3層だけがGoogleへの唯一の経路になる</text>

  <!-- Blocked direct-fetch path from Agent/Gadget -->
  <g>
    <path class="blocked" marker-end="url(#arBlocked)" d="M165,445 L165,170"/>
    <line x1="153" y1="248" x2="177" y2="272" stroke="#8a000d" stroke-width="4" stroke-linecap="round"/>
    <line x1="177" y1="248" x2="153" y2="272" stroke="#8a000d" stroke-width="4" stroke-linecap="round"/>
    <text x="190" y="245" class="note">直接 fetch は全遮断</text>
    <rect x="190" y="255" width="178" height="32" rx="6" fill="#19120f"/>
    <text x="279" y="276" text-anchor="middle" class="badge-text">globalOutbound: null</text>
  </g>

  <!-- Agent / Gadget box -->
  <g>
    <rect x="50" y="445" width="230" height="110" rx="8" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
    <text x="165" y="478" text-anchor="middle" class="box-title">エージェント / Gadget</text>
    <text x="165" y="498" text-anchor="middle" class="box-sub">動的ロードされる Worker</text>
    <text x="165" y="518" text-anchor="middle" class="box-sub">(チャットで生成される個人用アプリ)</text>
  </g>

  <!-- gatekeeper-analytics container -->
  <g>
    <rect x="395" y="150" width="340" height="440" rx="10" fill="none" stroke="#bb5537" stroke-width="2.5"/>
    <text x="565" y="178" text-anchor="middle" class="stage-accent">gatekeeper-analytics</text>
    <rect x="485" y="190" width="160" height="28" rx="14" fill="#bb5537"/>
    <text x="565" y="209" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">唯一の出口</text>

    <!-- Vendor -->
    <rect x="415" y="220" width="300" height="90" rx="6" fill="#ffffff" stroke="#bb5537" stroke-width="2"/>
    <text x="565" y="244" text-anchor="middle" class="box-title-accent">Vendor（状態なし）</text>
    <text x="565" y="264" text-anchor="middle" class="box-sub">connectAccount()</text>
    <text x="565" y="282" text-anchor="middle" class="box-sub">nonce付き接続URLを発行するだけ</text>

    <!-- Account -->
    <rect x="415" y="330" width="300" height="90" rx="6" fill="#ffffff" stroke="#bb5537" stroke-width="2"/>
    <text x="565" y="354" text-anchor="middle" class="box-title-accent">Account（SA資格情報を保持）</text>
    <text x="565" y="374" text-anchor="middle" class="box-sub">clientEmail / privateKeyPem を保管</text>
    <text x="565" y="392" text-anchor="middle" class="box-sub">JWT Bearer でアクセストークンをミント</text>

    <!-- Session -->
    <rect x="415" y="440" width="300" height="120" rx="6" fill="#ffffff" stroke="#bb5537" stroke-width="2"/>
    <text x="565" y="464" text-anchor="middle" class="box-title-accent">Session（1 GA4プロパティに束縛）</text>
    <text x="565" y="484" text-anchor="middle" class="box-sub">describe / getMetadata / runReport</text>
    <text x="565" y="504" text-anchor="middle" class="box-sub">DOファセットとして提供</text>
    <text x="565" y="524" text-anchor="middle" class="note">全メソッドが authorizeObservation() 経由</text>

    <!-- internal vertical arrows -->
    <path class="arrow" marker-end="url(#ar)" d="M565,310 L565,330"/>
    <text x="580" y="323" class="arrow-label">UserAccount DO 発行</text>
    <path class="arrow" marker-end="url(#ar)" d="M565,420 L565,440"/>
    <text x="580" y="433" class="arrow-label">アクセストークンを供給</text>
  </g>

  <!-- Google group -->
  <g>
    <rect x="820" y="300" width="340" height="290" rx="10" fill="none" stroke="#3b2922" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="990" y="322" text-anchor="middle" class="stage">Google</text>

    <rect x="840" y="330" width="300" height="90" rx="6" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
    <text x="990" y="354" text-anchor="middle" class="box-title">oauth2.googleapis.com</text>
    <text x="990" y="374" text-anchor="middle" class="box-sub">/token エンドポイント</text>
    <text x="990" y="392" text-anchor="middle" class="box-sub">JWT Bearer をアクセストークンに交換</text>

    <rect x="840" y="440" width="300" height="120" rx="6" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
    <text x="990" y="464" text-anchor="middle" class="box-title">GA4 Data API</text>
    <text x="990" y="484" text-anchor="middle" class="box-sub">Google Analytics Data API</text>
    <text x="990" y="504" text-anchor="middle" class="box-sub">describe / getMetadata / runReport</text>
    <text x="990" y="524" text-anchor="middle" class="box-sub">を実行</text>
  </g>

  <!-- Cross-column arrows -->
  <!-- Agent/Gadget -> Session (the sole valid entry point) -->
  <path class="arrow-accent" marker-end="url(#arAccent)" d="M280,500 L415,500"/>
  <text x="348" y="485" text-anchor="middle" class="arrow-label" font-weight="700" fill="#bb5537">呼び出し (authorizeObservation経由)</text>

  <!-- Account <-> oauth2.googleapis.com -->
  <path class="arrow" marker-end="url(#ar)" d="M715,365 L840,365"/>
  <text x="758" y="353" text-anchor="middle" class="arrow-label">JWT Bearer 送信</text>
  <path class="arrow" marker-end="url(#ar)" d="M840,392 L715,392"/>
  <text x="758" y="410" text-anchor="middle" class="arrow-label">アクセストークン</text>

  <!-- Session -> GA4 Data API -->
  <path class="arrow" marker-end="url(#ar)" d="M715,500 L840,500"/>
  <text x="758" y="488" text-anchor="middle" class="arrow-label">API 呼び出し</text>
  <text x="758" y="516" text-anchor="middle" class="caption">(Bearer付き)</text>

  <!-- Legend -->
  <g>
    <line x1="350" y1="615" x2="374" y2="615" class="arrow" marker-end="url(#ar)"/>
    <text x="380" y="619" class="legend-text">内部フロー</text>

    <line x1="475" y1="615" x2="515" y2="615" stroke="#8a000d" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="521" y="619" class="legend-text" fill="#8a000d">遮断 (globalOutbound: null)</text>

    <line x1="731" y1="615" x2="755" y2="615" class="arrow-accent" marker-end="url(#arAccent)"/>
    <text x="761" y="619" class="legend-text" font-weight="700" fill="#bb5537">唯一の呼び出し経路</text>
  </g>

  <text x="595" y="650" text-anchor="middle" class="caption">GA4 Data API への経路はすべて Gatekeeper 経由 — Agent/Gadget からの直接アクセスは存在しない</text>
</svg>
