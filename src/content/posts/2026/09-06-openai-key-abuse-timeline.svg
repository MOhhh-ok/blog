<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <rect width="1200" height="675" fill="#f2f0ee"/>

  <!-- タイトル -->
  <text x="60" y="48" font-size="26" font-weight="700" fill="#19120f">鍵を削除したあとも約 15 分、リクエストが通り続けた</text>
  <text x="60" y="78" font-size="14" fill="#8a7468">2026/9/6 18:00〜20:10（日本時間）　この日だけで 896 リクエスト / 35.3M input tokens / $269.19</text>

  <!-- 凡例 -->
  <rect x="836" y="34" width="18" height="18" rx="3" fill="#bb5537"/>
  <text x="862" y="49" font-size="13.5" fill="#3b2922">鍵が有効だったあいだの利用</text>
  <rect x="836" y="62" width="18" height="18" rx="3" fill="#8a000d"/>
  <text x="862" y="77" font-size="13.5" fill="#3b2922">削除済みの鍵によるリクエスト</text>

  <!-- 軸ラベル -->
  <text x="60" y="146" font-size="12.5" fill="#8a7468">1 分あたりの利用量</text>

  <!-- グリッド -->
  <line x1="90" y1="500" x2="1140" y2="500" stroke="#3b2922" stroke-width="1.5"/>
  <line x1="90" y1="410" x2="1140" y2="410" stroke="#ddd5cf" stroke-width="1"/>
  <line x1="90" y1="320" x2="1140" y2="320" stroke="#ddd5cf" stroke-width="1"/>
  <line x1="90" y1="230" x2="1140" y2="230" stroke="#ddd5cf" stroke-width="1"/>

  <!-- 面グラフ 第1相: 18:37〜19:16 鍵が有効 -->
  <path d="M 389 500 L 399 470 L 410 425 L 424 370 L 441 320 L 462 283 L 487 266 L 515 272 L 545 258 L 575 268 L 605 256 L 635 266 L 665 257 L 690 264 L 704 259 L 704 500 Z"
        fill="#bb5537" fill-opacity="0.85" stroke="#8a000d" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- 面グラフ 第2相: 19:17〜19:51 削除済みの鍵 -->
  <path d="M 712 500 L 718 462 L 726 410 L 736 358 L 748 322 L 762 308 L 776 316 L 790 306 L 800 330 L 810 390 L 818 452 L 825 500 Z"
        fill="#8a000d" fill-opacity="0.85" stroke="#8a000d" stroke-width="1.5"/>

  <!-- 19:31〜19:51 リクエストはゼロ、計上だけが後追い -->
  <rect x="825" y="404" width="162" height="96" fill="#bb5537" fill-opacity="0.12" stroke="#bb5537" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="906" y="376" font-size="12.5" font-weight="700" fill="#8a000d" text-anchor="middle">リクエストはゼロ</text>
  <text x="906" y="394" font-size="12.5" fill="#3b2922" text-anchor="middle">計上だけが後追いで積まれる</text>

  <!-- 18:37 の注記 -->
  <line x1="389" y1="430" x2="389" y2="500" stroke="#3b2922" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="381" y="420" font-size="13.5" font-weight="700" fill="#3b2922" text-anchor="end">18:37 利用が急増</text>

  <!-- 集計遅れの注記 -->
  <rect x="152" y="158" width="418" height="62" rx="8" fill="#ffffff" stroke="#d8b3a4"/>
  <text x="168" y="181" font-size="13.5" font-weight="700" fill="#8a000d">集計は後追いで積まれる</text>
  <text x="168" y="204" font-size="13" fill="#3b2922">19:16:13 Org $60 → 19:16:32 Project $100 → 19:16:56 Org $80</text>

  <!-- 削除後継続の注記 -->
  <text x="860" y="224" font-size="14.5" font-weight="700" fill="#8a000d" text-anchor="middle">削除した鍵で約 15 分そのまま通った</text>
  <text x="860" y="246" font-size="13" fill="#3b2922" text-anchor="middle">上限 $250 に対し合計 $275.46 まで通過</text>

  <!-- 以後ゼロ -->
  <text x="1064" y="482" font-size="13.5" fill="#8a7468" text-anchor="middle">以後ゼロ</text>

  <!-- イベント縦線 + 番号 -->
  <line x1="591" y1="168" x2="591" y2="500" stroke="#3b2922" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="591" cy="158" r="13" fill="#3b2922"/>
  <text x="591" y="163" font-size="14" font-weight="700" fill="#f2f0ee" text-anchor="middle">1</text>

  <line x1="704" y1="203" x2="704" y2="500" stroke="#19120f" stroke-width="2"/>
  <circle cx="704" cy="190" r="13" fill="#19120f"/>
  <text x="704" y="195" font-size="14" font-weight="700" fill="#f2f0ee" text-anchor="middle">2</text>

  <line x1="712" y1="300" x2="712" y2="500" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="712" y1="300" x2="727" y2="300" stroke="#bb5537" stroke-width="2"/>
  <circle cx="740" cy="300" r="13" fill="#bb5537"/>
  <text x="740" y="305" font-size="14" font-weight="700" fill="#f2f0ee" text-anchor="middle">3</text>

  <line x1="987" y1="288" x2="987" y2="500" stroke="#19120f" stroke-width="2"/>
  <circle cx="987" cy="275" r="13" fill="#19120f"/>
  <text x="987" y="280" font-size="14" font-weight="700" fill="#f2f0ee" text-anchor="middle">4</text>

  <!-- 時刻目盛り -->
  <line x1="90" y1="500" x2="90" y2="508" stroke="#3b2922" stroke-width="1.5"/>
  <text x="90" y="527" font-size="13" fill="#3b2922" text-anchor="middle">18:00</text>
  <line x1="332" y1="500" x2="332" y2="508" stroke="#3b2922" stroke-width="1.5"/>
  <text x="332" y="527" font-size="13" fill="#3b2922" text-anchor="middle">18:30</text>
  <line x1="575" y1="500" x2="575" y2="508" stroke="#3b2922" stroke-width="1.5"/>
  <text x="575" y="527" font-size="13" fill="#3b2922" text-anchor="middle">19:00</text>
  <line x1="817" y1="500" x2="817" y2="508" stroke="#3b2922" stroke-width="1.5"/>
  <text x="817" y="527" font-size="13" fill="#3b2922" text-anchor="middle">19:30</text>
  <line x1="1059" y1="500" x2="1059" y2="508" stroke="#3b2922" stroke-width="1.5"/>
  <text x="1059" y="527" font-size="13" fill="#3b2922" text-anchor="middle">20:00</text>

  <!-- イベント説明カード -->
  <rect x="90" y="552" width="252" height="86" rx="8" fill="#ffffff" stroke="#e0d8d2"/>
  <circle cx="114" cy="576" r="12" fill="#3b2922"/>
  <text x="114" y="581" font-size="13" font-weight="700" fill="#f2f0ee" text-anchor="middle">1</text>
  <text x="134" y="581" font-size="14" font-weight="700" fill="#19120f">19:02</text>
  <text x="106" y="604" font-size="12.5" fill="#3b2922">自動チャージが月上限 $100 に到達。</text>
  <text x="106" y="623" font-size="12.5" fill="#3b2922">以降は残高が補充されない</text>

  <rect x="356" y="552" width="252" height="86" rx="8" fill="#ffffff" stroke="#e0d8d2"/>
  <circle cx="380" cy="576" r="12" fill="#19120f"/>
  <text x="380" y="581" font-size="13" font-weight="700" fill="#f2f0ee" text-anchor="middle">2</text>
  <text x="400" y="581" font-size="14" font-weight="700" fill="#19120f">19:16:57</text>
  <text x="372" y="604" font-size="12.5" fill="#3b2922">Org の上限 $80 に到達し</text>
  <text x="372" y="623" font-size="12.5" fill="#3b2922">API 停止（1 回目）</text>

  <rect x="622" y="552" width="252" height="86" rx="8" fill="#ffffff" stroke="#bb5537" stroke-width="1.5"/>
  <circle cx="646" cy="576" r="12" fill="#bb5537"/>
  <text x="646" y="581" font-size="13" font-weight="700" fill="#f2f0ee" text-anchor="middle">3</text>
  <text x="666" y="581" font-size="14" font-weight="700" fill="#19120f">19:17 頃</text>
  <text x="638" y="604" font-size="12.5" fill="#3b2922">鍵を削除。直後に上限を</text>
  <text x="638" y="623" font-size="12.5" fill="#3b2922">$250 へ引き上げ</text>

  <rect x="888" y="552" width="252" height="86" rx="8" fill="#ffffff" stroke="#e0d8d2"/>
  <circle cx="912" cy="576" r="12" fill="#19120f"/>
  <text x="912" y="581" font-size="13" font-weight="700" fill="#f2f0ee" text-anchor="middle">4</text>
  <text x="932" y="581" font-size="14" font-weight="700" fill="#19120f">19:51</text>
  <text x="904" y="604" font-size="12.5" fill="#3b2922">後追いの計上が Project 上限</text>
  <text x="904" y="623" font-size="12.5" fill="#3b2922">$250 に到達し停止（2 回目）</text>

  <text x="90" y="662" font-size="11.5" fill="#8a7468">※ 縦軸は Usage の 1 分粒度のグラフの形をなぞったもので、目盛りは付けていない</text>
</svg>
